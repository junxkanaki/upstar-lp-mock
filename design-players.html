<!DOCTYPE html>
<html lang="ja">

<title>UPSTAR 選手一覧ページ モック（#454 C-5）</title>
<style>
/* ==========================================================================
   選手一覧ページ（/athletes）のリデザイン案 — 4案切替
   現行実装: upstar-lp/src/app/athletes/page.tsx
     ・ヘッダー＋3カラム(SP2カラム)の正方形グリッド＋フッターのみ。見出しなし
     ・カード = 写真(角丸・1:1) + 名前 + クラブ名
   データは design-full-v5/v6 と同じ assets/players.js（58名）を使用
   ========================================================================== */
:root{
  --fg:#000; --bg:#fff; --ink:#0a0a0b;
  --muted:rgba(0,0,0,.55);
  --border:rgba(0,0,0,.14);
  --surface:#f3f3f5;
  --accent:#12b9c1; --accent-dark:#00a2ad; --accent-light:#6fdce4;
  --s1:.5rem; --s2:.75rem; --s3:1rem; --s4:1.5rem; --s5:2rem; --s6:3rem; --s7:4rem; --s8:6rem;
  --max:1440px; --pad:clamp(20px,4vw,64px);
}
*{box-sizing:border-box;margin:0;padding:0}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
body{
  font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif;
  font-size:1.0625rem;line-height:1.6;letter-spacing:-.005em;color:var(--fg);background:#e9e9ec;
  -webkit-font-smoothing:antialiased;
}

/* ===== モックのシェル（v5/v6と同じ作り） ===== */
.shell{position:sticky;top:0;z-index:300;background:#11131a;color:#fff;padding:11px 18px;
  display:flex;gap:16px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 20px rgba(0,0,0,.35)}
.shell b{font-size:13px}
.shell small{opacity:.55;font-weight:400}
.seg{display:flex;gap:4px;align-items:center}
.seg > span{font-size:11px;opacity:.5;margin-right:4px}
.seg button,.seg a{appearance:none;border:1px solid rgba(255,255,255,.22);background:transparent;
  color:rgba(255,255,255,.72);font:inherit;font-size:12px;font-weight:600;padding:5px 12px;
  border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:#fff;color:#11131a;border-color:#fff}
.shell .spacer{margin-left:auto}
.phonewrap{display:none;justify-content:center;padding:26px 12px 44px;background:#e9e9ec}
body.is-phone .phonewrap{display:flex}
body.is-phone #site{display:none}
.phone{width:390px;height:780px;border-radius:34px;border:10px solid #14161c;overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.28);background:#fff}
.phone iframe{width:100%;height:100%;border:0;display:block}
body.is-frame .shell,body.is-frame .phonewrap{display:none !important}

/* ===== サイト本体 ===== */
#site{background:var(--bg);color:var(--fg);overflow-x:hidden;min-height:100vh}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--pad)}

/* ヘッダー: v6の「浮きピル」と同じ。サブページなのでスクロールに追従（sticky） */
.hdr{position:sticky;top:var(--shellh,0px);z-index:90;display:flex;justify-content:center;
  padding:var(--s4) var(--pad)}
body.is-frame .hdr{top:0}
.hdr .menu{display:flex;flex:1;max-width:680px;align-items:center;justify-content:space-between;
  background:rgba(10,10,11,.9);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(20px);
  border-radius:18px;padding:8px 8px 8px 18px}
.hdr .logo{width:104px;height:25px;object-fit:contain;object-position:left center}
.hdr nav{display:flex;align-items:center;gap:var(--s4)}
.hdr nav .lk{font-size:.9375rem;font-weight:600;color:rgba(255,255,255,.92)}
.hdr nav .dl{background:#fff;color:#000;font-size:.9375rem;font-weight:700;padding:9px 15px;border-radius:11px}

/* 入場アニメ（軽量版）: .rise が画面に入ったらふわっと上がる */
.rise{opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s cubic-bezier(.16,.86,.28,1)}
.rise.in{opacity:1;transform:none}

/* ===== ページ見出し（全案共通の枠。配色は案ごと） ===== */
.phead{padding:clamp(56px,9vh,120px) 0 clamp(32px,5vh,64px)}
.phead .kick{font-size:11px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;
  color:var(--accent-dark)}
.phead h1{font-size:clamp(40px,7vw,120px);line-height:.94;letter-spacing:-.045em;font-weight:900;
  text-transform:uppercase;margin-top:10px}
.phead .lead{margin-top:var(--s4);font-size:15px;color:var(--muted);max-width:30em}
.phead .lead b{font-size:1.4em;color:inherit}

/* ==========================================================================
   案A: ダークグリッド — 現行の3カラム構成をv6の黒基調に載せ替える
   写真はモノクロで待機し、ホバーでカラー＋ズーム（トップのATHLETES帯と同じ振る舞い）
   ========================================================================== */
.la{display:none}
body.list-a .la{display:block}
body.list-a #site{background:var(--ink);color:#fff}
body.list-a .phead .kick{color:var(--accent-light)}
body.list-a .phead .lead{color:rgba(255,255,255,.6)}
.la .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,2vw,32px);
  padding-bottom:clamp(72px,11vh,150px)}
.la .card .ph{position:relative;overflow:hidden;border-radius:8px;background:#1a1a1c;aspect-ratio:1}
.la .card img{width:100%;height:100%;object-fit:cover;filter:grayscale(.5);
  transition:transform .7s cubic-bezier(.16,.86,.28,1),filter .5s ease}
.la .card:hover img{transform:scale(1.05);filter:grayscale(0)}
.la .card .name{font-size:clamp(16px,1.5vw,21px);font-weight:800;margin-top:14px;letter-spacing:-.01em}
.la .card .club{font-size:13px;color:rgba(255,255,255,.55);margin-top:3px}

/* ==========================================================================
   案B: モザイク全員 — 小さめタイルをフルブリードで敷き詰めて「58人」の量を見せる
   ホバーで名前がオーバーレイ表示
   ========================================================================== */
.lb{display:none}
body.list-b .lb{display:block}
body.list-b #site{background:var(--ink);color:#fff}
body.list-b .phead .kick{color:var(--accent-light)}
body.list-b .phead .lead{color:rgba(255,255,255,.6)}
.lb .mosaic{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;
  padding:0 4px clamp(72px,11vh,150px)}
.lb .tile{position:relative;overflow:hidden;aspect-ratio:3/4;background:#1a1a1c}
.lb .tile img{width:100%;height:100%;object-fit:cover;filter:grayscale(.65) brightness(.9);
  transition:transform .6s cubic-bezier(.16,.86,.28,1),filter .45s ease}
.lb .tile:hover img{transform:scale(1.07);filter:grayscale(0) brightness(1)}
.lb .tile .cap{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.88));
  opacity:0;transition:opacity .35s ease}
.lb .tile:hover .cap{opacity:1}
.lb .tile .name{font-size:13px;font-weight:800}
.lb .tile .club{font-size:10px;color:rgba(255,255,255,.6)}

/* ==========================================================================
   案C: 名簿（エディトリアル） — 白背景。番号＋大きな名前の行リスト。
   ホバーで行が黒く反転し、カーソルに写真プレビューが追従（PCのみ）
   ========================================================================== */
.lc{display:none}
body.list-c .lc{display:block}
.lc .rows{border-top:1px solid var(--border);margin-bottom:clamp(72px,11vh,150px)}
.lc .row{display:grid;grid-template-columns:64px 1fr auto;gap:var(--s4);align-items:baseline;
  padding:clamp(14px,2vh,24px) var(--s3);border-bottom:1px solid var(--border);
  transition:background .25s ease,color .25s ease;cursor:default}
.lc .row .no{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--muted)}
.lc .row .name{font-size:clamp(22px,3.4vw,44px);font-weight:900;letter-spacing:-.03em;line-height:1.15}
.lc .row .club{font-size:13px;color:var(--muted);text-align:right}
.lc .row:hover{background:var(--ink);color:#fff}
.lc .row:hover .no,.lc .row:hover .club{color:rgba(255,255,255,.6)}
/* カーソル追従プレビュー */
.lc-peek{position:fixed;z-index:200;width:230px;aspect-ratio:3/4;pointer-events:none;
  overflow:hidden;border-radius:10px;box-shadow:0 30px 60px rgba(0,0,0,.4);
  opacity:0;transform:scale(.92);transition:opacity .25s ease,transform .25s ease}
.lc-peek.on{opacity:1;transform:scale(1)}
.lc-peek img{width:100%;height:100%;object-fit:cover}
@media (hover:none),(max-width:900px){ .lc-peek{display:none} }

/* ==========================================================================
   案D: マガジン — 白背景。大判写真の2カラムを左右で上下にずらし、
   雑誌のようにゆったり見せる。名前は写真の下に大きく
   ========================================================================== */
.ld{display:none}
body.list-d .ld{display:block}
.ld .mag{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,4vw,72px) clamp(20px,3vw,56px);
  padding-bottom:clamp(72px,11vh,150px)}
.ld .card:nth-child(even){transform:translateY(clamp(36px,7vh,110px))}
.ld .card .ph{overflow:hidden;border-radius:4px;background:#ececef;aspect-ratio:4/5}
.ld .card img{width:100%;height:100%;object-fit:cover;
  transition:transform .8s cubic-bezier(.16,.86,.28,1)}
.ld .card:hover img{transform:scale(1.045)}
.ld .card .meta{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3);
  margin-top:16px}
.ld .card .name{font-size:clamp(20px,2.2vw,30px);font-weight:900;letter-spacing:-.02em}
.ld .card .club{font-size:13px;color:var(--muted);text-align:right}
/* 偶数列を下げたぶん、末尾に余白を足す */
.ld .mag::after{content:"";display:block;height:clamp(36px,7vh,110px);grid-column:1/-1}

/* ==========================================================================
   案E: 無限ドラッグキャンバス — 全方向にドラッグできる「選手の壁」。
   タイルは端でループし、触るまではゆっくり自動で流れる。
   参考: Codrops "Infinite Canvas: Building a Seamless, Pan-Anywhere Image Space"
         https://tympanus.net/codrops/2026/01/07/infinite-canvas-building-a-seamless-pan-anywhere-image-space/
         （無限パン・ラップアラウンド格子のパターンをDOMで簡易再現）
   ========================================================================== */
.le{display:none}
body.list-e .le{display:block}
body.list-e #site{background:var(--ink);color:#fff}
body.list-e .phead .kick{color:var(--accent-light)}
body.list-e .phead .lead{color:rgba(255,255,255,.6)}
.le .board{position:relative;height:calc(100svh - 160px);min-height:480px;overflow:hidden;
  cursor:grab;touch-action:none}
.le .board.drag{cursor:grabbing}
.le .cell{position:absolute;top:0;left:0;overflow:hidden;border-radius:6px;background:#1a1a1c;
  will-change:transform}
.le .cell img{width:100%;height:100%;object-fit:cover;filter:grayscale(.6) brightness(.85);
  transition:filter .35s ease;pointer-events:none}
.le .cell:hover img{filter:grayscale(0) brightness(1)}
.le .cell .cap{position:absolute;left:0;right:0;bottom:0;padding:8px 10px;font-size:12px;font-weight:800;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.85));opacity:0;transition:opacity .3s}
.le .cell:hover .cap{opacity:1}
.le .hint{position:absolute;left:50%;bottom:18px;translate:-50% 0;z-index:5;font-size:12px;
  letter-spacing:.14em;color:rgba(255,255,255,.7);background:rgba(10,10,11,.6);
  border:1px solid rgba(255,255,255,.22);padding:8px 18px;border-radius:999px;
  pointer-events:none;backdrop-filter:blur(8px)}

/* ==========================================================================
   案F: キャラクターセレクト — ゲームのキャラ選択UIをロースターに転用。
   左のリストを選ぶと右の固定ステージ（巨大番号＋写真＋名前）が切り替わる。
   参考: ・esportsチームのロースターページ（例 OG Esports https://ogs.gg/our-new-roster/）
         ・背番号タイポの文化（Wooter "Best Fonts for Football Jersey Numbers"
           https://wooter.com/articles/best-fonts-football-jersey-numbers/）
         ・非選択メンバーをグレーアウトする手法（HubSpot "The 15 best Meet the Team pages"
           https://blog.hubspot.com/marketing/creative-agency-team-pages の Dapper Agency 例）
   ========================================================================== */
.lf{display:none}
body.list-f .lf{display:block}
body.list-f #site{background:var(--ink);color:#fff}
body.list-f .phead .kick{color:var(--accent-light)}
body.list-f .phead .lead{color:rgba(255,255,255,.6)}
.lf .sel{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);
  gap:clamp(24px,4vw,64px);align-items:start;padding-bottom:clamp(72px,11vh,150px)}
.lf .list{max-height:76vh;overflow:auto;border-top:1px solid rgba(255,255,255,.14);
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.3) transparent}
.lf .item{display:grid;grid-template-columns:74px 1fr;gap:4px 14px;align-items:baseline;
  padding:13px 10px;border-bottom:1px solid rgba(255,255,255,.12);cursor:pointer;
  color:rgba(255,255,255,.6);transition:background .2s ease,color .2s ease}
.lf .item .no{font-size:22px;font-weight:900;font-style:italic;letter-spacing:-.02em;
  color:rgba(255,255,255,.26);transition:color .2s ease}
.lf .item .nm{font-size:17px;font-weight:800}
.lf .item .cl{grid-column:2;font-size:11px;color:rgba(255,255,255,.38)}
.lf .item:hover,.lf .item.on{background:rgba(255,255,255,.07);color:#fff}
.lf .item.on .no{color:var(--accent-light)}
.lf .stage{position:sticky;top:calc(var(--shellh,0px) + 96px)}
.lf .bignum{position:absolute;right:0;top:-24px;z-index:1;
  font-size:clamp(120px,16vw,280px);line-height:.8;font-weight:900;font-style:italic;
  letter-spacing:-.05em;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.22)}
.lf .ph{position:relative;z-index:2;width:min(430px,78%);aspect-ratio:3/4;overflow:hidden;
  border-radius:12px;background:#1a1a1c;box-shadow:0 40px 90px rgba(0,0,0,.55)}
.lf .ph img{width:100%;height:100%;object-fit:cover;transition:opacity .22s ease}
.lf .meta{position:relative;z-index:2;margin-top:18px}
.lf .meta .nm{font-size:clamp(28px,3vw,44px);font-weight:900;letter-spacing:-.02em}
.lf .meta .cl{font-size:14px;color:rgba(255,255,255,.55);margin-top:4px}

/* ===== フッター（v6と同じ） ===== */
.ftr{background:var(--ink);color:#fff;padding:clamp(60px,9vh,110px) 0}
body.list-a .ftr,body.list-b .ftr{border-top:1px solid rgba(255,255,255,.12)}
.ftr .top{display:flex;justify-content:space-between;gap:var(--s6);flex-wrap:wrap}
.ftr .links{display:grid;grid-template-columns:repeat(2,minmax(180px,auto));gap:13px var(--s6);font-size:14px}
.ftr .links a{color:rgba(255,255,255,.6)}
.ftr .copy{font-size:12px;color:rgba(255,255,255,.45);margin-top:var(--s4)}

/* ===== レスポンシブ ===== */
@media (max-width:1024px){
  .la .grid{grid-template-columns:repeat(3,1fr)}
  .lb .mosaic{grid-template-columns:repeat(4,1fr)}
}
@media (max-width:640px){
  .hdr nav .lk{display:none}
  .hdr .menu{padding:6px 6px 6px 12px}
  .hdr .logo{width:84px;height:20px}
  .hdr nav{gap:6px}
  .hdr nav .dl{font-size:12px;padding:8px 10px;border-radius:9px}
  /* 現行 /athletes はSPで2カラム。案Aはそれを踏襲 */
  .la .grid{grid-template-columns:repeat(2,1fr);gap:14px}
  .la .card .name{font-size:15px;margin-top:10px}
  .lb .mosaic{grid-template-columns:repeat(3,1fr)}
  .lc .row{grid-template-columns:40px 1fr;gap:10px}
  .lc .row .club{grid-column:2;text-align:left;margin-top:2px}
  .ld .mag{grid-template-columns:1fr}
  .ld .card:nth-child(even){transform:none}
  .ld .mag::after{display:none}
  .le .board{height:70svh;min-height:420px}
  .lf .sel{grid-template-columns:1fr}
  .lf .stage{position:static;order:-1}
  .lf .list{max-height:46vh}
  .ftr .links{grid-template-columns:1fr}
}
</style>
</head>

<script>
const params = new URLSearchParams(location.search);
const isFrame = params.get("frame") === "1";
if (isFrame) document.body.classList.add("is-frame");

/* 案の初期化（URLパラメータ ?list=a|b|c|d） */
{
  const v = ["a","b","c","d","e","f"].includes(params.get("list")) ? params.get("list") : "a";
  document.body.className = document.body.className.replace(/list-\w+/, "list-" + v);
  document.querySelectorAll("[data-list]").forEach(x =>
    x.setAttribute("aria-pressed", String(x.dataset.list === v)));
}

const img = (u, w) => u + (u.includes("?") ? "&" : "?") + "w=" + w + "&fm=webp";
document.querySelector("[data-count]").textContent = PLAYERS.length;

/* ---- 入場アニメ ---- */
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
}), { threshold: .12 });
document.querySelectorAll(".rise").forEach(el => io.observe(el));
const watch = el => { el.classList.add("rise"); io.observe(el); };

/* ---- 各案のレンダリング（表示した案だけ組み立てる） ---- */
const built = {};
const builders = {
  /* A: 現行の3カラム構成をそのまま黒基調へ */
  a(){
    const box = document.querySelector("[data-la]");
    PLAYERS.forEach(p => {
      const c = document.createElement("div");
      c.className = "card";
      c.innerHTML = '<div class="ph"><img loading="lazy" src="' + img(p.u, 640) + '" alt="' + p.n + '"></div>' +
        '<p class="name">' + p.n + '</p><p class="club">' + (p.c === "-" ? "&nbsp;" : p.c) + '</p>';
      box.appendChild(c); watch(c);
    });
  },
  /* B: タイルを敷き詰める */
  b(){
    const box = document.querySelector("[data-lb]");
    PLAYERS.forEach(p => {
      const t = document.createElement("div");
      t.className = "tile";
      t.innerHTML = '<img loading="lazy" src="' + img(p.u, 420) + '" alt="' + p.n + '">' +
        '<div class="cap"><p class="name">' + p.n + '</p>' +
        (p.c === "-" ? "" : '<p class="club">' + p.c + '</p>') + '</div>';
      box.appendChild(t);
    });
  },
  /* C: 名簿 + カーソル追従プレビュー */
  c(){
    const box = document.querySelector("[data-lc]");
    const peek = document.querySelector("[data-peek]"), pimg = peek.querySelector("img");
    PLAYERS.forEach((p, i) => {
      const r = document.createElement("div");
      r.className = "row";
      r.innerHTML = '<span class="no">' + String(i + 1).padStart(2, "0") + '</span>' +
        '<span class="name">' + p.n + '</span>' +
        '<span class="club">' + (p.c === "-" ? "" : p.c) + '</span>';
      r.addEventListener("mouseenter", () => { pimg.src = img(p.u, 460); peek.classList.add("on"); });
      r.addEventListener("mouseleave", () => peek.classList.remove("on"));
      box.appendChild(r);
    });
    addEventListener("mousemove", e => {
      peek.style.left = Math.min(e.clientX + 28, innerWidth - 250) + "px";
      peek.style.top = Math.min(e.clientY - 120, innerHeight - 330) + "px";
    });
  },
  /* D: 大判2カラム */
  d(){
    const box = document.querySelector("[data-ld]");
    PLAYERS.forEach(p => {
      const c = document.createElement("div");
      c.className = "card";
      c.innerHTML = '<div class="ph"><img loading="lazy" src="' + img(p.u, 900) + '" alt="' + p.n + '"></div>' +
        '<div class="meta"><p class="name">' + p.n + '</p>' +
        '<p class="club">' + (p.c === "-" ? "" : p.c) + '</p></div>';
      box.appendChild(c); watch(c);
    });
  },
  /* E: 無限ドラッグキャンバス。8x8=64マス（58人+先頭6人）を敷き、
     はみ出したタイルを反対側へ回して無限にループさせる */
  e(){
    const board = document.querySelector("[data-le]");
    const G = 8, R = 8, GAP = 8;
    const cells = [];
    for (let k = 0; k < G * R; k++) {
      const p = PLAYERS[k % PLAYERS.length];
      const d = document.createElement("div");
      d.className = "cell";
      d.innerHTML = '<img loading="lazy" src="' + img(p.u, 420) + '" alt="' + p.n + '">' +
        '<p class="cap">' + p.n + '</p>';
      board.appendChild(d);
      cells.push({ el: d, col: k % G, row: (k / G) | 0 });
    }
    let tw, th, W, H, ox = 0, oy = 0, vx = 0, vy = 0, down = null;
    const place = () => cells.forEach(c => {
      const x = (((c.col * (tw + GAP) + ox) % W) + W) % W - (tw + GAP);
      const y = (((c.row * (th + GAP) + oy) % H) + H) % H - (th + GAP);
      c.el.style.transform = "translate(" + x + "px," + y + "px)";
    });
    const size = () => {
      tw = Math.max(150, board.clientWidth / 6.5); th = tw * 4 / 3;
      W = G * (tw + GAP); H = R * (th + GAP);
      cells.forEach(c => { c.el.style.width = tw + "px"; c.el.style.height = th + "px"; });
      place();
    };
    board.addEventListener("pointerdown", ev => {
      down = { x: ev.clientX, y: ev.clientY }; vx = vy = 0;
      board.classList.add("drag"); board.setPointerCapture(ev.pointerId);
    });
    board.addEventListener("pointermove", ev => {
      if (!down) return;
      vx = ev.clientX - down.x; vy = ev.clientY - down.y;
      ox += vx; oy += vy; down = { x: ev.clientX, y: ev.clientY }; place();
    });
    const up = () => {
      if (!down) return;
      down = null; board.classList.remove("drag");
      (function coast(){ vx *= .94; vy *= .94;
        if (Math.abs(vx) > .4 || Math.abs(vy) > .4) { ox += vx; oy += vy; place(); requestAnimationFrame(coast); } })();
    };
    board.addEventListener("pointerup", up);
    board.addEventListener("pointercancel", up);
    size(); addEventListener("resize", size);
    /* 触られるまでは、ゆっくり自動で流して「動くもの」だと伝える */
    let auto = true;
    board.addEventListener("pointerdown", () => auto = false, { once: true });
    (function drift(){ if (auto) { ox -= .25; oy -= .12; place(); } requestAnimationFrame(drift); })();
  },
  /* F: キャラクターセレクト。リスト選択で右の固定ステージが切り替わる */
  f(){
    const list = document.querySelector("[data-lf]");
    const num = document.querySelector("[data-lf-num]"), pic = document.querySelector("[data-lf-img]");
    const nm = document.querySelector("[data-lf-name]"), cl = document.querySelector("[data-lf-club]");
    let cur = -1;
    const set = i => {
      if (i === cur) return;
      cur = i;
      const p = PLAYERS[i];
      num.textContent = String(i + 1).padStart(2, "0");
      nm.textContent = p.n;
      cl.textContent = p.c === "-" ? "" : p.c;
      pic.style.opacity = 0;
      const u = img(p.u, 640);
      const pre = new Image();
      pre.onload = () => { if (cur === i) { pic.src = u; pic.style.opacity = 1; } };
      pre.src = u;
      list.querySelectorAll(".item").forEach((el, k) => el.classList.toggle("on", k === i));
    };
    PLAYERS.forEach((p, i) => {
      const r = document.createElement("div");
      r.className = "item";
      r.innerHTML = '<span class="no">' + String(i + 1).padStart(2, "0") + '</span>' +
        '<span class="nm">' + p.n + '</span>' +
        (p.c === "-" ? "" : '<span class="cl">' + p.c + '</span>');
      r.addEventListener("mouseenter", () => set(i));
      r.addEventListener("click", () => set(i));
      list.appendChild(r);
    });
    set(0);
  },
};
const build = v => { if (!built[v]) { built[v] = true; builders[v](); } };
build(document.body.className.match(/list-(\w)/)[1]);

/* ---- シェル ---- */
if (!isFrame) {
  /* シェル(sticky)の高さぶんヘッダーを下げる（v6と同じ手当て） */
  const shellEl = document.querySelector(".shell");
  const setShellH = () =>
    document.documentElement.style.setProperty("--shellh", shellEl.offsetHeight + "px");
  setShellH();
  addEventListener("resize", setShellH);

  const frame = document.getElementById("phoneFrame");
  const cur = () => document.body.className.match(/list-(\w)/)[1];
  const reloadFrame = () => frame.src = "design-players.html?frame=1&list=" + cur();

  document.querySelectorAll("[data-list]").forEach(b => b.addEventListener("click", () => {
    const v = b.dataset.list;
    document.body.className = document.body.className.replace(/list-\w+/, "list-" + v);
    document.querySelectorAll("[data-list]").forEach(x =>
      x.setAttribute("aria-pressed", String(x.dataset.list === v)));
    build(v);
    if (document.body.classList.contains("is-phone")) reloadFrame();
  }));

  const pc = document.getElementById("btnPc"), sp = document.getElementById("btnSp");
  const setW = phone => {
    document.body.classList.toggle("is-phone", phone);
    pc.setAttribute("aria-pressed", String(!phone));
    sp.setAttribute("aria-pressed", String(phone));
    if (phone) reloadFrame();
  };
  pc.addEventListener("click", () => setW(false));
  sp.addEventListener("click", () => setW(true));
}
</script>
</body>
