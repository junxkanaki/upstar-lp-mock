<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>UPSTAR 選手一覧ページ（ダークグリッド確定 / #454 C-5）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- v7（design-full-v7.html）と同じ書体をそろえる -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   選手一覧ページ（/athletes）— 「ダークグリッド」で確定（2026-09-19）
   現行実装: upstar-lp/src/app/athletes/page.tsx
     ・ヘッダー＋3カラム(SP2カラム)の正方形グリッド＋フッターのみ。見出しなし
     ・カード = 写真(角丸・1:1) + 名前 + クラブ名
   データは design-full-v5/v6 と同じ assets/players.js（58名）を使用
   ========================================================================== */
:root{
  --fg:#000; --bg:#fff; --ink:#0a0a0b;
  --muted:rgba(0,0,0,.55);
  --border:rgba(0,0,0,.14);
  --surface:#f3f3f5;
  --accent:#12b9c1; --accent-dark:#00a2ad; --accent-light:#6fdce4;
  --s1:.5rem; --s2:.75rem; --s3:1rem; --s4:1.5rem; --s5:2rem; --s6:3rem; --s7:4rem; --s8:6rem;
  --max:1440px; --pad:clamp(20px,4vw,64px);
}
*{box-sizing:border-box;margin:0;padding:0}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
body{
  font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif;
  font-size:1.0625rem;line-height:1.6;letter-spacing:-.005em;color:var(--fg);background:#e9e9ec;
  -webkit-font-smoothing:antialiased;
}

/* ===== モックのシェル（v5/v6と同じ作り） ===== */
.shell{position:sticky;top:0;z-index:300;background:#11131a;color:#fff;padding:11px 18px;
  display:flex;gap:16px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 20px rgba(0,0,0,.35)}
.shell b{font-size:13px}
.shell small{opacity:.55;font-weight:400}
.seg{display:flex;gap:4px;align-items:center}
.seg > span{font-size:11px;opacity:.5;margin-right:4px}
.seg button,.seg a{appearance:none;border:1px solid rgba(255,255,255,.22);background:transparent;
  color:rgba(255,255,255,.72);font:inherit;font-size:12px;font-weight:600;padding:5px 12px;
  border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:#fff;color:#11131a;border-color:#fff}
.shell .spacer{margin-left:auto}
.phonewrap{display:none;justify-content:center;padding:26px 12px 44px;background:#e9e9ec}
body.is-phone .phonewrap{display:flex}
body.is-phone #site{display:none}
.phone{width:390px;height:780px;border-radius:34px;border:10px solid #14161c;overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.28);background:#fff}
.phone iframe{width:100%;height:100%;border:0;display:block}
body.is-frame .shell,body.is-frame .phonewrap{display:none !important}

/* ===== サイト本体 ===== */
#site{background:var(--bg);color:var(--fg);overflow-x:hidden;min-height:100vh}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--pad)}

/* ヘッダー: v7と完全に同じ配置（fixed・中央寄せ・同じ余白）。
   背景はv7の確定ヒーロー「顔の壁」と同じ不透明の黒（9/19指摘で位置・見た目を再統一） */
.hdr{position:fixed;top:0;left:0;right:0;z-index:90;display:flex;justify-content:center;
  padding:var(--s4) var(--pad)}
body.is-frame .hdr{position:absolute;top:0}
body:not(.is-frame) .hdr{top:var(--shellh,0px)}
.hdr .menu{display:flex;flex:1;max-width:680px;align-items:center;justify-content:space-between;
  background:var(--ink);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(20px);
  border-radius:18px;padding:8px 8px 8px 18px}
.hdr .logo{width:104px;height:25px;object-fit:contain;object-position:left center}
.hdr nav{display:flex;align-items:center;gap:var(--s4)}
.hdr nav .lk{font-size:.9375rem;font-weight:600;color:rgba(255,255,255,.92)}
.hdr nav .dl{background:#fff;color:#000;font-size:.9375rem;font-weight:700;padding:9px 15px;border-radius:11px}

/* 入場アニメ（軽量版）: .rise が画面に入ったらふわっと上がる */
.rise{opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s cubic-bezier(.16,.86,.28,1)}
.rise.in{opacity:1;transform:none}

/* ===== ページ見出し =====
   見出しの書体・サイズは v7 の ATHLETES 見出し（.ath h2）と同値にそろえる。
   ヘッダーをfixedにしたぶん、上余白にバーの高さ（約90px）を足す */
.phead{padding:calc(90px + clamp(48px,8vh,110px)) 0 clamp(32px,5vh,64px)}
.phead .kick{font-size:11px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;
  color:var(--accent-dark)}
.phead h1{font-size:clamp(38px,7vw,120px);line-height:.92;letter-spacing:-.045em;font-weight:900;
  text-transform:uppercase;margin-top:10px}
.phead .lead{margin-top:var(--s4);font-size:15px;color:var(--muted);max-width:30em}
.phead .lead b{font-size:1.4em;color:inherit}

/* ==========================================================================
   案A: ダークグリッド — 現行の3カラム構成をv6の黒基調に載せ替える
   写真はモノクロで待機し、ホバーでカラー＋ズーム（トップのATHLETES帯と同じ振る舞い）
   ========================================================================== */
.la{display:none}
body.list-a .la{display:block}
body.list-a #site{background:var(--ink);color:#fff}
body.list-a .phead .kick{color:var(--accent-light)}
body.list-a .phead .lead{color:rgba(255,255,255,.6)}
.la .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,2vw,32px);
  padding-bottom:clamp(72px,11vh,150px)}
.la .card .ph{position:relative;overflow:hidden;border-radius:8px;background:#1a1a1c;aspect-ratio:1}
.la .card img{width:100%;height:100%;object-fit:cover;filter:grayscale(.5);
  transition:transform .7s cubic-bezier(.16,.86,.28,1),filter .5s ease}
.la .card:hover img{transform:scale(1.05);filter:grayscale(0)}
.la .card .name{font-size:clamp(16px,1.5vw,21px);font-weight:800;margin-top:14px;letter-spacing:-.01em}
.la .card .club{font-size:13px;color:rgba(255,255,255,.55);margin-top:3px}


/* ===== フッター（v6と同じ） ===== */
.ftr{background:var(--ink);color:#fff;padding:clamp(60px,9vh,110px) 0}
body.list-a .ftr{border-top:1px solid rgba(255,255,255,.12)}
.ftr .top{display:flex;justify-content:space-between;gap:var(--s6);flex-wrap:wrap}
.ftr .links{display:grid;grid-template-columns:repeat(2,minmax(180px,auto));gap:13px var(--s6);font-size:14px}
.ftr .links a{color:rgba(255,255,255,.6)}
.ftr .copy{font-size:12px;color:rgba(255,255,255,.45);margin-top:var(--s4)}

/* ===== レスポンシブ ===== */
@media (max-width:1024px){
  .la .grid{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:640px){
  .hdr nav .lk{display:none}
  .hdr .menu{padding:6px 6px 6px 12px}
  .hdr .logo{width:84px;height:20px}
  .hdr nav{gap:6px}
  .hdr nav .dl{font-size:12px;padding:8px 10px;border-radius:9px}
  /* 現行 /athletes はSPで2カラム。案Aはそれを踏襲 */
  .la .grid{grid-template-columns:repeat(2,1fr);gap:14px}
  .la .card .name{font-size:15px;margin-top:10px}
  .ftr .links{grid-template-columns:1fr}
}
</style>
</head>
<body class="list-a">

<div class="shell">
  <b>UPSTAR 選手一覧ページ <small>ダークグリッド確定 · #454 / C-5</small></b>
  <div class="seg spacer"><span>幅</span>
    <button id="btnPc" aria-pressed="true">PC</button>
    <button id="btnSp">スマホ 390px</button>
  </div>
  <div class="seg">
    <a href="design-full-v7.html">LP（v7）へ</a>
  </div>
</div>

<div class="phonewrap"><div class="phone"><iframe id="phoneFrame" title="スマホ幅プレビュー"></iframe></div></div>

<div id="site">

  <header class="hdr">
    <div class="menu">
      <a href="design-full-v7.html"><img class="logo" src="assets/logo-white.png" alt="UPSTAR"></a>
      <nav>
        <a class="lk" href="design-full-v7.html#features">Features</a>
        <a class="lk" href="design-full-v7.html#movie">Movie</a>
        <a class="lk" href="design-full-v7.html#athletes">Athletes</a>
        <a class="dl" href="#">App Store</a>
        <a class="dl" href="#">Google Play</a>
      </nav>
    </div>
  </header>

  <!-- ページ見出し（全案共通。人数はplayers.jsから算出） -->
  <div class="phead"><div class="wrap">
    <p class="kick rise">Athletes</p>
    <h1 class="rise">For The<br>Athletes</h1>
  </div></div>

  <!-- ダークグリッド（確定） -->
  <section class="la"><div class="wrap"><div class="grid" data-la></div></div></section>


  <footer class="ftr"><div class="wrap">
    <div class="top">
      <div>
        <a href="design-full-v7.html"><img src="assets/logo-white.png" alt="UPSTAR" style="width:140px"></a>
        <p class="copy">© Emer inc. All Rights Reserved.</p>
      </div>
      <div class="links">
        <a href="design-full-v7.html">トップ</a><a href="#">選手一覧</a>
        <a href="https://note.com/upstar/n/n1edb86ac200e" target="_blank" rel="noopener noreferrer">アプリ利用ガイド</a>
        <a href="design-full-v7.html#faq">FAQ</a><a href="#">お問い合わせ</a>
        <a href="#">特商法に関する表記</a>
        <a href="#">利用規約</a><a href="#">プライバシーポリシー</a>
        <a href="https://www.emer.co.jp/" target="_blank" rel="noopener noreferrer">運営会社</a>
      </div>
    </div>
  </div></footer>
</div>

<script src="assets/players.js"></script>
<script>
const params = new URLSearchParams(location.search);
const isFrame = params.get("frame") === "1";
if (isFrame) document.body.classList.add("is-frame");


const img = (u, w) => u + (u.includes("?") ? "&" : "?") + "w=" + w + "&fm=webp";
/* リード文（人数表示）は2026-09-24のFBで削除 */

/* ---- 入場アニメ ---- */
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
}), { threshold: .12 });
document.querySelectorAll(".rise").forEach(el => io.observe(el));
const watch = el => { el.classList.add("rise"); io.observe(el); };

/* ---- 各案のレンダリング（表示した案だけ組み立てる） ---- */
const builders = {
  /* ダークグリッド: 現行の3カラム構成を黒基調へ（確定案） */
  a(){
    const box = document.querySelector("[data-la]");
    PLAYERS.forEach(p => {
      const c = document.createElement("div");
      c.className = "card";
      c.innerHTML = '<div class="ph"><img loading="lazy" src="' + img(p.u, 640) + '" alt="' + p.n + '"></div>' +
        '<p class="name">' + p.n + '</p><p class="club">' + (p.c === "-" ? "&nbsp;" : p.c) + '</p>';
      box.appendChild(c); watch(c);
    });
  },
};
builders.a();

/* ---- シェル ---- */
if (!isFrame) {
  /* シェル(sticky)の高さぶんヘッダーを下げる（v6と同じ手当て） */
  const shellEl = document.querySelector(".shell");
  const setShellH = () =>
    document.documentElement.style.setProperty("--shellh", shellEl.offsetHeight + "px");
  setShellH();
  addEventListener("resize", setShellH);

  const frame = document.getElementById("phoneFrame");
  const reloadFrame = () => frame.src = "design-players.html?frame=1";

  const pc = document.getElementById("btnPc"), sp = document.getElementById("btnSp");
  const setW = phone => {
    document.body.classList.toggle("is-phone", phone);
    pc.setAttribute("aria-pressed", String(!phone));
    sp.setAttribute("aria-pressed", String(phone));
    if (phone) reloadFrame();
  };
  pc.addEventListener("click", () => setW(false));
  sp.addEventListener("click", () => setW(true));
}
</script>
</body>
</html>
